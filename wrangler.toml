name = "natal"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "natal-db"
database_id = "f3892e2d-93b3-43fe-a3d7-b035a84f7c29"

[assets]
directory = "./"
binding = "ASSETS"
# Só /api passa pelo Worker; o resto (o jogo) sai direto dos assets.
run_worker_first = ["/api/*"]
