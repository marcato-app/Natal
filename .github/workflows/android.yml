# Gera o APK de teste do Android a cada push (baixe em Actions > a execução > Artifacts).
name: App Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: node scripts/app-web.mjs && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vila-de-natal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
